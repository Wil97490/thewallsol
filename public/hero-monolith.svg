<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" role="img" aria-label="The Wall monolith">
<defs>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#070707"/>
    <stop offset=".38" stop-color="#171313"/>
    <stop offset=".68" stop-color="#2a2220"/>
    <stop offset="1" stop-color="#0a0808"/>
  </linearGradient>
  <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#403331"/>
    <stop offset=".45" stop-color="#181313"/>
    <stop offset="1" stop-color="#090808"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
    <stop offset=".5" stop-color="#B98CFF" stop-opacity=".95"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
    <stop offset=".44" stop-color="#8B5CF6" stop-opacity=".16"/>
    <stop offset=".5" stop-color="#F2EAFF" stop-opacity=".98"/>
    <stop offset=".56" stop-color="#8B5CF6" stop-opacity=".16"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g"><feFuncA type="table" tableValues="0 .10"/></feComponentTransfer>
  </filter>
  <pattern id="cracks" width="180" height="210" patternUnits="userSpaceOnUse">
    <path d="M38 8l-8 28 10 19-12 30 15 26-10 33" fill="none" stroke="#6c5b58" stroke-opacity=".34" stroke-width="2"/>
    <path d="M118 22l-16 24 9 22-18 27 17 22-12 33" fill="none" stroke="#74625e" stroke-opacity=".22" stroke-width="1.6"/>
    <path d="M74 92l18 18-7 18 13 16" fill="none" stroke="#0a0808" stroke-opacity=".7" stroke-width="4"/>
  </pattern>
</defs>

<!-- mass -->
<path d="M155 820 L132 642 L146 435 L129 245 L170 104 L236 46 L312 30 L393 54 L470 43 L554 94 L598 226 L585 382 L604 558 L582 815 Z" fill="url(#stone)" stroke="#514640" stroke-width="3"/>
<!-- left shadow plane -->
<path d="M155 820 L132 642 L146 435 L129 245 L170 104 L236 46 L285 57 L261 208 L270 386 L254 604 L280 814 Z" fill="#080707" opacity=".75"/>
<!-- lit plane -->
<path d="M285 57 L312 30 L393 54 L470 43 L554 94 L598 226 L585 382 L604 558 L582 815 L514 812 L500 610 L516 432 L494 220 L430 78 Z" fill="url(#facet)" opacity=".8"/>
<!-- edge bevel -->
<path d="M430 78 L494 220 L516 432 L500 610 L514 812" fill="none" stroke="url(#edge)" stroke-width="5" opacity=".6"/>
<!-- stone microtexture -->
<path d="M155 820 L132 642 L146 435 L129 245 L170 104 L236 46 L312 30 L393 54 L470 43 L554 94 L598 226 L585 382 L604 558 L582 815 Z" fill="url(#cracks)" opacity=".8"/>
<path d="M155 820 L132 642 L146 435 L129 245 L170 104 L236 46 L312 30 L393 54 L470 43 L554 94 L598 226 L585 382 L604 558 L582 815 Z" filter="url(#noise)" opacity=".55"/>

<!-- central energy seam -->
<rect x="351" y="26" width="20" height="790" fill="#8B5CF6" opacity=".18" filter="url(#soft)"/>
<rect x="357" y="28" width="8" height="788" fill="url(#beam)" opacity=".98"/>

<!-- embedded lightning-like fissures -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M236 156 L260 192 L241 232 L271 270 L246 318 L281 362 L253 412 L286 447" stroke="#090707" stroke-width="10" opacity=".88"/>
  <path d="M494 174 L466 216 L485 250 L454 292 L476 330 L447 374 L468 420" stroke="#090707" stroke-width="12" opacity=".88"/>
  <path d="M298 536 L324 565 L310 602 L338 632 L320 684" stroke="#080707" stroke-width="8" opacity=".92"/>
  <path d="M420 528 L402 562 L420 596 L397 632 L414 671" stroke="#080707" stroke-width="8" opacity=".92"/>
  <path d="M236 156 L260 192 L241 232 L271 270 L246 318 L281 362 L253 412 L286 447" stroke="#7A55C7" stroke-width="1.5" opacity=".55"/>
  <path d="M494 174 L466 216 L485 250 L454 292 L476 330 L447 374 L468 420" stroke="#8B5CF6" stroke-width="1.5" opacity=".5"/>
</g>

<!-- carved wordmark -->
<text x="360" y="448" text-anchor="middle" fill="#090707" stroke="#B7ABA4" stroke-opacity=".18" stroke-width="2" paint-order="stroke" font-family="Georgia,serif" font-size="58" font-weight="700" letter-spacing="2">THE</text>
<text x="360" y="512" text-anchor="middle" fill="#080707" stroke="#C2B4AE" stroke-opacity=".16" stroke-width="2" paint-order="stroke" font-family="Georgia,serif" font-size="82" font-weight="700" letter-spacing="1">WALL</text>
</svg>